<style>
  :root{
    --ink:#12141C;
    --ink-soft:#1B1E2A;
    --paper:#F4F2EC;
    --paper-dim:#C9C6BC;
    --gold:#E3A23C;
    --line:rgba(244,242,236,0.12);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }

  .page{
    width:100%;
    max-width:520px;
    padding:64px 24px 48px;
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }

  /* ---------- Hero ---------- */
  .hero{
    text-align:center;
    margin-bottom:48px;
    opacity:0;
    animation: rise 0.7s ease forwards;
  }
  @keyframes rise{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }

  .freq{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--gold);
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin-bottom:22px;
  }
  .dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--gold);
    box-shadow:0 0 0 0 rgba(227,162,60,0.6);
    animation:pulse 2.2s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(227,162,60,0.45);}
    70%{box-shadow:0 0 0 8px rgba(227,162,60,0);}
    100%{box-shadow:0 0 0 0 rgba(227,162,60,0);}
  }

  .avatar{
    width:88px; height:88px;
    border-radius:50%;
    margin:0 auto 22px;
    background:
      radial-gradient(circle at 30% 30%, #2A2D3C, var(--ink-soft));
    border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:30px;
    color:var(--gold);
  }

  h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:clamp(28px, 7vw, 36px);
    letter-spacing:-0.01em;
    line-height:1.15;
    margin-bottom:10px;
  }
  .tagline{
    font-size:15px;
    color:var(--paper-dim);
    line-height:1.5;
    max-width:340px;
    margin:0 auto;
  }

  /* ---------- Channel list ---------- */
  .band{
    display:flex;
    align-items:center;
    gap:12px;
    margin:8px 0 18px;
    color:var(--paper-dim);
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
  }
  .band::before, .band::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--line);
  }

  .channels{
    display:flex;
    flex-direction:column;
    gap:12px;
    list-style:none;
  }

  .channel{
    opacity:0;
    animation: rise 0.6s ease forwards;
  }

  .channel a{
    display:flex;
    align-items:center;
    gap:16px;
    text-decoration:none;
    color:var(--paper);
    background:var(--ink-soft);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px 18px;
    transition: border-color 0.25s ease, transform 0.25s ease, background 0.25s ease;
    position:relative;
    overflow:hidden;
  }
  .channel a:hover, .channel a:focus-visible{
    border-color:rgba(227,162,60,0.55);
    transform:translateY(-2px);
    background:#20232F;
  }
  .channel a:focus-visible{
    outline:2px solid var(--gold);
    outline-offset:2px;
  }
  .channel a:active{ transform:translateY(0); }

  .ch-code{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--gold);
    width:34px;
    flex-shrink:0;
  }

  .ch-icon{
    width:38px; height:38px;
    border-radius:10px;
    background:rgba(244,242,236,0.06);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .ch-icon svg{ width:18px; height:18px; }

  .ch-text{ flex:1; min-width:0; }
  .ch-name{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:15px;
    margin-bottom:2px;
  }
  .ch-sub{
    font-size:12.5px;
    color:var(--paper-dim);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .ch-go{
    font-family:'JetBrains Mono', monospace;
    font-size:16px;
    color:var(--paper-dim);
    flex-shrink:0;
    transition:transform 0.25s ease, color 0.25s ease;
  }
  .channel a:hover .ch-go{ transform:translateX(3px); color:var(--gold); }

  /* stagger */
  .channel:nth-child(1){animation-delay:0.05s;}
  .channel:nth-child(2){animation-delay:0.12s;}
  .channel:nth-child(3){animation-delay:0.19s;}
  .channel:nth-child(4){animation-delay:0.26s;}
  .channel:nth-child(5){animation-delay:0.33s;}
  .channel:nth-child(6){animation-delay:0.40s;}

  /* ---------- Ad slot (Adsterra Native Banner) ---------- */
  .ad-slot{
    margin-top:28px;
    opacity:0;
    animation: rise 0.6s ease forwards;
    animation-delay:0.45s;
  }
  .ad-label{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--paper-dim);
    opacity:0.6;
    margin-bottom:8px;
    text-align:center;
  }
  .ad-container{
    border:1px solid var(--line);
    border-radius:14px;
    background:var(--ink-soft);
    padding:12px;
    min-height:60px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* Mockup pratinjau — bentuk kira-kira Native Banner Adsterra (dummy, ganti dgn script asli) */
  .ad-preview{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    width:100%;
  }
  .ad-item{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .ad-thumb{
    width:100%;
    aspect-ratio:4/3;
    border-radius:8px;
    background:repeating-linear-gradient(
      45deg,
      rgba(244,242,236,0.05),
      rgba(244,242,236,0.05) 8px,
      rgba(244,242,236,0.09) 8px,
      rgba(244,242,236,0.09) 16px
    );
  }
  .ad-title{
    font-size:11.5px;
    line-height:1.35;
    color:var(--paper-dim);
  }
  .ad-title b{ color:var(--paper); font-weight:500; }

  footer{
    margin-top:auto;
    padding-top:48px;
    text-align:center;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.08em;
    color:var(--paper-dim);
    opacity:0.7;
  }
</style>
